root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "tmp/api"
  full_bin = "./tmp/api"
  include_ext = ["go", "env"]
  exclude_dir = ["tmp", "bin", "docs", "migrations", "storage", ".git", ".agents"]
  exclude_regex = ["_test.go"]
  delay = 1000
  stop_on_error = true

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
