openapi: 3.0.3
info:
  title: Hanjo ERP - Authentication & Session Module
  description: >-
    Spesifikasi RESTful API Otentikasi & Manajemen Sesi untuk Hanjo ERP & POS Backend.
    Mendukung Dual-UX Login (Dashboard Web via Email/Password & POS Tablet via PIN Outlet),
    JWT RS256 Asymmetric Signing, HttpOnly Cookie Refresh Token, dan Bcrypt Password Hashing.
  version: 1.0.0
  contact:
    name: Hanjo Engineering Team
    email: dev@hanjo.id
servers:
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: Auth
    description: Dual-UX Authentication, JWT RS256, POS PIN Login, dan Session Management

paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Dashboard Web Login (Email & Password)
      description: >-
        Otentikasi kredensial pengguna untuk Dashboard Web ERP (Developer, Owner Holding, Brand Manager, Branch Manager).
        Mengembalikan Access Token JWT RS256 di body response dan menyetel Refresh Token ke dalam HttpOnly Secure Cookie.
        Mendukung login via Email atau Username.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil, access token dan profile dikembalikan.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...; Path=/api/v1/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Format JSON request tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Kredensial tidak valid (email atau password salah).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validasi input gagal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Terlalu banyak percobaan login gagal, akun terkunci sementara selama 15 menit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/pos/login:
    post:
      tags:
        - Auth
      summary: Fast POS Login (Outlet ID, Username & PIN)
      description: >-
        Otentikasi cepat untuk aplikasi Kasir POS Tablet dan Kitchen/Bar Display di outlet fisik.
        Menggunakan kombinasi Outlet ID (UUID), Username staff, dan 6-digit numeric PIN.
        Memverifikasi bahwa staf benar-benar terdaftar aktif pada outlet yang bersangkutan.
        Dilengkapi proteksi anti brute-force otomatis (terkunci 15 menit setelah 5x salah PIN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POSLoginRequest'
      responses:
        '200':
          description: Login POS berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Format JSON tidak valid atau parameter outlet_id bukan UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Kredensial atau PIN POS salah.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validasi input gagal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Terlalu banyak percobaan PIN salah, kasir terkunci sementara selama 15 menit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh Access Token
      description: >-
        Memperbarui Access Token yang telah kedaluwarsa menggunakan Refresh Token yang tersimpan di HttpOnly Cookie
        atau yang dikirimkan pada request body (opsional untuk mobile/POS client tanpa cookie support).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenSuccessResponse'
        '401':
          description: Refresh token tidak ditemukan, kadaluwarsa, atau tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout & Revoke Session
      description: >-
        Mengakhiri sesi pengguna aktif dan menghapus cookie HttpOnly `refresh_token`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: logout berhasil
                data: null
        '401':
          description: Token otentikasi tidak disertakan atau tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Get Current User Profile & Tenant Context
      description: >-
        Mendapatkan informasi profil lengkap pengguna yang sedang terotentikasi,
        termasuk relasi hierarki multi-tenant: Organization ID, Brand ID, dan Outlet ID.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil pengguna berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Token otentikasi tidak valid atau kadaluwarsa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Pengguna tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/me/password:
    put:
      tags:
        - Auth
      summary: Self-Service Update Password
      description: >-
        Mengubah password akun pengguna yang sedang login setelah memvalidasi password saat ini.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Password saat ini tidak sesuai atau format body tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Password baru tidak boleh sama dengan password saat ini, atau validasi gagal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/me/pin:
    put:
      tags:
        - Auth
      summary: Self-Service Update POS PIN
      description: >-
        Mengubah atau mengatur PIN 4-8 digit pengguna untuk mesin kasir/POS tablet.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePINRequest'
      responses:
        '200':
          description: PIN kasir berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: PIN saat ini tidak sesuai atau wajib diisi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: PIN baru tidak boleh sama dengan PIN saat ini, atau validasi gagal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan Access Token JWT RS256 (format "Bearer <token>")

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "operasi berhasil"
        data:
          type: object

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "INVALID_CREDENTIALS"
            message:
              type: string
              example: "email atau password salah"
            details:
              type: object
              additionalProperties: true

    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email akun atau username staf
          example: "dev@hanjo.id"
        password:
          type: string
          format: password
          minLength: 6
          description: Kata sandi pengguna
          example: "Password123!"

    POSLoginRequest:
      type: object
      required:
        - outlet_id
        - username
        - pin
      properties:
        outlet_id:
          type: string
          format: uuid
          description: ID unik Outlet fisik tempat terminal POS beroperasi
          example: "04826e26-f9e9-4200-b653-18b2b652c13c"
        username:
          type: string
          description: Username staf kasir / barista di outlet tersebut
          example: "kasir.kemang"
        pin:
          type: string
          pattern: '^[0-9]{4,8}$'
          description: PIN numerik staf (4-8 digit)
          example: "123456"

    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Opsional jika dikirim via body alih-alih cookie
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhM2Y2Y2JkNy00ZWMzLTQ4MTktOTczYS04ZmZkNWY0ZjhhZDciLCJvcmdfaWQiOiJlYmNmNWQyMC0zZmJhLTQyZGQtOGQ2Yi00YjVjODU5ZTAyOGIiLCJ1c2VybmFtZSI6ImRldmVsb3BlciIsImV4cCI6MTgwMDAwMDAwMH0..."
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Masa berlaku token dalam detik (900s = 15 menit)
          example: 900
        expires_at:
          type: string
          format: date-time
          example: "2026-10-17T22:30:00Z"

    UserOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a3f6cbd7-4ec3-4819-973a-8ffd5f4f8ad7"
        organization_id:
          type: string
          format: uuid
          example: "ebcf5d20-3fba-42dd-8d6b-4b5c859e028b"
        brand_id:
          type: string
          format: uuid
          nullable: true
          example: null
        outlet_id:
          type: string
          format: uuid
          nullable: true
          example: null
        username:
          type: string
          example: "developer"
        email:
          type: string
          example: "dev@hanjo.id"
        status:
          type: string
          example: "ACTIVE"

    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "login berhasil"
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserOutput'
            tokens:
              $ref: '#/components/schemas/TokenPair'

    RefreshTokenSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "token berhasil diperbarui"
        data:
          $ref: '#/components/schemas/TokenPair'

    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "profil berhasil diambil"
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: "a3f6cbd7-4ec3-4819-973a-8ffd5f4f8ad7"
            organization_id:
              type: string
              format: uuid
              example: "ebcf5d20-3fba-42dd-8d6b-4b5c859e028b"
            brand_id:
              type: string
              format: uuid
              nullable: true
              example: null
            outlet_id:
              type: string
              format: uuid
              nullable: true
              example: null
            username:
              type: string
              example: "developer"
            email:
              type: string
              example: "dev@hanjo.id"
            status:
              type: string
              example: "ACTIVE"
            created_at:
              type: string
              format: date-time
              example: "2026-10-17T22:15:50Z"
            updated_at:
              type: string
              format: date-time
              example: "2026-10-17T22:15:50Z"

    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          example: "OldSecret123"
        new_password:
          type: string
          minLength: 8
          example: "NewSecret456"

    ChangePINRequest:
      type: object
      required:
        - new_pin
      properties:
        current_pin:
          type: string
          minLength: 4
          maxLength: 8
          example: "123456"
          description: Diperlukan jika pengguna sebelumnya telah mengatur PIN.
        new_pin:
          type: string
          minLength: 4
          maxLength: 8
          example: "654321"
