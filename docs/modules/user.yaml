openapi: 3.0.3
info:
  title: Hanjo ERP - User & Staff Management Module
  description: >-
    Spesifikasi RESTful API untuk User & Staff Management pada Hanjo ERP.
    Mendukung isolasi multi-tenant, CRUD staf (Kasir, Barista, Kitchen, Branch Manager),
    serta integrasi relation preloading (Organization, Brand, Outlet) tanpa masalah query N+1.
  version: 1.0.0
  contact:
    name: Hanjo Engineering Team
    email: dev@hanjo.id
servers:
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: User Management
    description: Lifecycle staf & identity (List, Detail, Create, Update, Status Toggle, Soft-Delete)

paths:
  /api/v1/users/lookup:
    get:
      tags:
        - User Management
      summary: Lookup Pengguna / Combobox Options
      description: >-
        Mengambil daftar staf aktif secara ringkas (hanya ID dan Nama) khusus untuk kebutuhan
        dropdown / combobox pada UI formulir dengan pagination terukur dan bebas data sensitif.
      security:
        - BearerAuth: []
      parameters:
        - name: outlet_id
          in: query
          description: Filter staf berdasarkan outlet tertentu
          schema:
            type: string
            format: uuid
        - name: brand_id
          in: query
          description: Filter staf berdasarkan brand tertentu
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Pencarian nama staf
          schema:
            type: string
        - name: page
          in: query
          description: Nomor halaman (default 1)
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Jumlah baris data per halaman (default 20, max 100)
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Daftar lookup berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLookupResponse'
        '401':
          description: Tidak terotentikasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/users:
    get:
      tags:
        - User Management
      summary: Daftar Pengguna & Staf (Paginated + Preloaded)
      description: >-
        Mengambil daftar staf di dalam organisasi dengan pagination, filter pencarian,
        serta otomatis menyertakan ringkasan relasi Organization, Brand, dan Outlet
        secara optimal (in-memory batch fetching, 0 query N+1).
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Nomor halaman (default 1)
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Jumlah item per halaman (default 20, max 100)
          schema:
            type: integer
            default: 20
        - name: brand_id
          in: query
          description: Filter berdasarkan ID Brand
          schema:
            type: string
            format: uuid
        - name: outlet_id
          in: query
          description: Filter berdasarkan ID Outlet fisik
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter status akun (ACTIVE, INACTIVE, SUSPENDED)
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, SUSPENDED]
        - name: search
          in: query
          description: Cari berdasarkan username atau email
          schema:
            type: string
      responses:
        '200':
          description: Daftar pengguna berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          description: Konteks organisasi tidak ditemukan atau query tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Tidak terotentikasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    post:
      tags:
        - User Management
      summary: Tambah Pengguna / Staf Baru
      description: |
        Menambahkan staf, kasir, atau manajer baru. Password di-hash menggunakan Bcrypt, dan PIN kasir POS (jika diisi) di-hash secara aman.

        #### 📋 Skema Request Body:
        | Field | Tipe Data | Status | Validasi / Aturan | Keterangan & Contoh |
        | :--- | :--- | :--- | :--- | :--- |
        | `username` | `string` | **Wajib** | Min 3, Max 50 karakter | Username unik staf untuk login back-office (`kasir.kemang`) |
        | `email` | `string (email)` | **Wajib** | Format email valid | Alamat email unik staf (`kasir.kemang@harmoni.id`) |
        | `password` | `string` | **Wajib** | Min 8 karakter | Password login awal (di-hash menggunakan Bcrypt) |
        | `role_id` | `string (uuid)` | *Opsional* | UUID v4 valid | ID peran dari `GET /api/v1/roles/lookup` untuk kontrol akses staf |
        | `brand_id` | `string (uuid)` | *Opsional* | UUID v4 valid | ID brand FnB (wajib jika peran berlevel `BRAND` atau `OUTLET`) |
        | `outlet_id` | `string (uuid)` | *Opsional* | UUID v4 valid | ID outlet fisik (wajib jika peran berlevel `OUTLET` / kasir) |
        | `pin` | `string` | *Opsional* | 4 - 8 digit numerik | PIN kasir untuk login cepat di POS tablet (di-hash aman) |
        | `status` | `string` | *Opsional* | Enum: `ACTIVE`, `INACTIVE`, `SUSPENDED` | Status keaktifan akun pengguna (default: `ACTIVE`) |
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Pengguna berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '400':
          description: Hierarki brand/outlet tidak valid atau format request keliru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email atau username sudah terdaftar dalam organisasi ini.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validasi field gagal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/users/{id}:
    get:
      tags:
        - User Management
      summary: Detail Pengguna
      description: Mengambil data detail profil pengguna beserta ringkasan relasi hierarki multi-tenant.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID pengguna
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Data pengguna ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '404':
          description: Pengguna tidak ditemukan dalam organisasi ini.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    put:
      tags:
        - User Management
      summary: Update Data Pengguna
      description: |
        Mengubah profil staf, re-assign outlet atau brand, perbarui peran (role), serta update password/PIN.

        #### 📋 Skema Request Body:
        | Field | Tipe Data | Status | Validasi / Aturan | Keterangan & Contoh |
        | :--- | :--- | :--- | :--- | :--- |
        | `username` | `string` | *Opsional* | Min 3, Max 50 karakter | Username baru akun jika ingin diperbarui |
        | `email` | `string (email)` | *Opsional* | Format email valid | Email baru akun jika ingin diperbarui |
        | `password` | `string` | *Opsional* | Min 8 karakter | Password baru (kosongkan jika tidak diganti) |
        | `role_id` | `string (uuid)` | *Opsional* | UUID v4 valid | ID peran baru jika staf dipromosikan / dimutasi peran |
        | `brand_id` | `string (uuid)` | *Opsional* | UUID v4 valid | ID brand baru jika staf dipindahkan ke brand lain |
        | `outlet_id` | `string (uuid)` | *Opsional* | UUID v4 valid | ID outlet baru jika staf dipindahkan ke cabang lain |
        | `pin` | `string` | *Opsional* | 4 - 8 digit numerik | PIN kasir POS baru (kosongkan jika tidak diganti) |
        | `status` | `string` | *Opsional* | Enum: `ACTIVE`, `INACTIVE`, `SUSPENDED` | Status akun pengguna |
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID pengguna
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Data pengguna berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '404':
          description: Pengguna tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email atau username baru telah digunakan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      tags:
        - User Management
      summary: Hapus Pengguna (Soft Delete)
      description: Menonaktifkan dan melakukan soft-delete akun staf dari database.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID pengguna
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pengguna berhasil dihapus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          description: Pengguna tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/users/{id}/status:
    patch:
      tags:
        - User Management
      summary: Toggle Status Pengguna
      description: |
        Mengubah status aktif/nonaktif akun staf (ACTIVE, INACTIVE, SUSPENDED).

        #### 📋 Skema Request Body:
        | Field | Tipe Data | Status | Validasi / Aturan | Keterangan & Contoh |
        | :--- | :--- | :--- | :--- | :--- |
        | `status` | `string` | **Wajib** | Enum: `ACTIVE`, `INACTIVE`, `SUSPENDED` | Status baru akun staf (`SUSPENDED`) |
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID pengguna
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status pengguna berhasil diubah.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '404':
          description: Pengguna tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          nullable: true
        error:
          nullable: true
          example: null

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        data:
          nullable: true
          example: null
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              nullable: true

    OrganizationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string

    BrandSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        logo_url:
          type: string
          nullable: true

    OutletSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        address:
          type: string

    RoleSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "04826e26-f9e9-4200-b653-18b2b652c13c"
        code:
          type: string
          example: "CASHIER"
        name:
          type: string
          example: "Kasir POS"
        tier:
          type: string
          enum: [ORGANIZATION, BRAND, OUTLET]
          example: "OUTLET"

    UserWithRelations:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
          nullable: true
        outlet_id:
          type: string
          format: uuid
          nullable: true
        role_id:
          type: string
          format: uuid
          nullable: true
          example: "04826e26-f9e9-4200-b653-18b2b652c13c"
        username:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          example: ACTIVE
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
        brand:
          $ref: '#/components/schemas/BrandSummary'
          nullable: true
        outlet:
          $ref: '#/components/schemas/OutletSummary'
          nullable: true
        role:
          $ref: '#/components/schemas/RoleSummary'
          nullable: true

    UserListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "daftar pengguna berhasil diambil"
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserWithRelations'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          nullable: true
          example: null

    UserDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "data pengguna berhasil ditemukan"
        data:
          $ref: '#/components/schemas/UserWithRelations'
        error:
          nullable: true
          example: null

    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: "kasir.kemang"
          description: "[WAJIB] Username unik staf untuk login sistem back-office (3-50 karakter)"
        email:
          type: string
          format: email
          example: "kasir.kemang@harmoni.id"
          description: "[WAJIB] Alamat email unik staf"
        password:
          type: string
          format: password
          minLength: 8
          example: "Password123!"
          description: "[WAJIB] Password akun staf (min 8 karakter, otomatis di-hash Bcrypt)"
        role_id:
          type: string
          format: uuid
          nullable: true
          example: "04826e26-f9e9-4200-b653-18b2b652c13c"
          description: "[OPSIONAL] UUID Peran staf dari GET /api/v1/roles/lookup untuk hak akses"
        brand_id:
          type: string
          format: uuid
          nullable: true
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          description: "[OPSIONAL] UUID Brand FnB (wajib diisi jika peran berlevel BRAND atau OUTLET)"
        outlet_id:
          type: string
          format: uuid
          nullable: true
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          description: "[OPSIONAL] UUID Outlet fisik cabang (wajib diisi jika peran berlevel OUTLET seperti Kasir/Barista)"
        pin:
          type: string
          minLength: 4
          maxLength: 8
          nullable: true
          example: "123456"
          description: "[OPSIONAL] PIN kasir POS tablet (4-8 digit numerik, otomatis di-hash Bcrypt)"
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
          default: ACTIVE
          example: "ACTIVE"
          description: "[OPSIONAL] Status awal akun pengguna (default: ACTIVE)"

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          nullable: true
          example: "kasir.kemang.baru"
          description: "[OPSIONAL] Username baru akun staf (3-50 karakter)"
        email:
          type: string
          format: email
          nullable: true
          example: "kasir.kemang@harmoni.id"
          description: "[OPSIONAL] Alamat email baru staf"
        password:
          type: string
          format: password
          minLength: 8
          nullable: true
          example: "NewPassword123!"
          description: "[OPSIONAL] Password baru jika ingin diubah (min 8 karakter)"
        role_id:
          type: string
          format: uuid
          nullable: true
          example: "04826e26-f9e9-4200-b653-18b2b652c13c"
          description: "[OPSIONAL] UUID Peran baru untuk mutasi/promosi staf"
        brand_id:
          type: string
          format: uuid
          nullable: true
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          description: "[OPSIONAL] UUID Brand baru jika staf dipindahkan ke brand lain"
        outlet_id:
          type: string
          format: uuid
          nullable: true
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          description: "[OPSIONAL] UUID Outlet baru jika staf dipindahkan ke outlet lain"
        pin:
          type: string
          minLength: 4
          maxLength: 8
          nullable: true
          example: "654321"
          description: "[OPSIONAL] PIN kasir POS baru (4-8 digit numerik)"
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
          nullable: true
          example: "ACTIVE"
          description: "[OPSIONAL] Status keaktifan akun pengguna"

    UpdateUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
          example: "ACTIVE"
          description: "[WAJIB] Status baru akun staf (ACTIVE, INACTIVE, SUSPENDED)"

    UserLookupItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        outlet_id:
          type: string
          format: uuid
          nullable: true
        brand_id:
          type: string
          format: uuid
          nullable: true

    UserLookupResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "lookup pengguna berhasil diambil"
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserLookupItem'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          nullable: true
          example: null

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total_data:
          type: integer
          example: 1
        total_pages:
          type: integer
          example: 1

    ResponseMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        summary:
          type: object
          nullable: true
          description: "Objek agregasi atau ringkasan opsional (misal laporan total finansial/transaksi)"

